    <h2>微软</h2>

    <p>最近有些人从公司内部的 Skype 联系我，我都暂时没有回应。也有一些尖酸小人在知乎讨论这种可能性。不过呢没什么好隐瞒的，就像他们猜测的那样，我确实加入了微软。</p>

<p>自从 Google 和 Coverity 的经历之后，我就对工作没有特别大的期望值和抱负，只希望能够有个安稳的生活。我在微软做的是很普通的编程工作，我从来不把自己等同为公司的一部分，所以也没什么好宣扬和八卦的。</p>

<p>之前有好几个微软的朋友跟我联系，向我推荐微软，而且说愿意帮我引荐。其实在那个时候我已经收到了微软的邀请，所以没有回应他们。在此我对这些人的好心表示感谢。</p>
